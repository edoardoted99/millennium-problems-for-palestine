name = "MPP"
defaultTargets = ["MPP"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

# Every module under MPP is built, including accepted solutions.
[[lean_lib]]
name = "MPP"
globs = ["MPP.+"]
